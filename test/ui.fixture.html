<!doctype html><html><head><meta charset="utf-8"><title>ui fixture</title>
<style>body{margin:0;font:13px system-ui;background:#ddd}.bar{padding:8px 12px;background:#222;color:#fff;display:flex;gap:14px;align-items:center}.bar a{color:#9cf}
iframe{border:0;background:#fff;display:block;box-shadow:0 4px 20px rgba(0,0,0,.3)}#popup{width:336px;height:400px;margin:16px}#options{width:100%;height:calc(100vh - 40px)}</style></head>
<body><div class="bar"><b>fixture</b><a href="?page=popup">popup</a><a href="?page=popup&url=https://x.com/home">popup @home</a><a href="?page=popup&configured=0&url=https://www.reddit.com/">popup unconfigured</a><a href="?page=options">options</a><a href="?page=options&configured=0">options unconfigured</a></div>
<script>
// Load the REAL popup.html / options.html, inject the chrome mock ahead of the page's own script, render in an iframe.
const qs = new URLSearchParams(location.search); const page = qs.get("page") || "popup";
fetch("/" + page + ".html").then(r => r.text()).then(html => {
  const f = document.createElement("iframe"); f.id = page;
  f.srcdoc = html.replace("<head>", `<head><base href="${location.origin}/"><script src="/test/mock-chrome.js?${qs}"><\/script>`);
  document.body.appendChild(f);
});
</script></body></html>
