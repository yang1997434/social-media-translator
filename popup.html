<!doctype html><html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
body{width:320px;padding:12px}
.top{display:flex;align-items:center;gap:10px;margin:2px 4px 12px}
.top h1{font-size:15px;margin:0;line-height:1.2}.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1}.gear{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:16px}.gear:hover{background:rgba(128,128,128,.12);color:var(--text);text-decoration:none}
.card-body{margin-top:10px;font-size:13px}.card-body .big{font-size:22px;font-weight:700;line-height:1.1}
.card-body .line{color:var(--muted);font-size:12px;margin-top:3px}
.cta{margin-top:10px;display:flex;gap:8px;align-items:center}.cta button{flex:1}
footer{margin:12px 4px 2px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.off .card-body{opacity:.5}
</style></head><body>
<div class="top"><div class="ico f" style="width:30px;height:30px;font-size:13px;border-radius:8px">X</div><div class="grow"><h1>X 助手</h1><div class="sub">自动翻译 · 评论过滤</div></div><a class="gear" id="gear" title="设置">⚙</a></div>

<section class="card" id="trCard">
  <div class="card-head"><span class="ico tr">译</span><div class="grow"><div class="title">自动翻译</div><div class="muted small" id="trSub">…</div></div>
    <label class="switch tr"><input type="checkbox" id="trEnabled"><span></span></label></div>
  <div class="card-body" id="trBody"></div>
</section>

<section class="card" id="fCard">
  <div class="card-head"><span class="ico f">滤</span><div class="grow"><div class="title">评论过滤</div><div class="muted small" id="fSub">…</div></div>
    <label class="switch"><input type="checkbox" id="fEnabled"><span></span></label></div>
  <div class="card-body" id="fBody"></div>
</section>

<footer><span id="ver"></span><a id="optLink">打开设置</a></footer>
<script src="popup.js"></script></body></html>
