<!doctype html><html lang="zh"><head><meta charset="utf-8">
<style>
body{width:300px;margin:0;padding:14px;font:13px/1.5 -apple-system,system-ui,sans-serif;color:#0f1419;background:#fff}
@media(prefers-color-scheme:dark){body{background:#16181c;color:#e7e9ea}.card{background:#202327!important}.muted{color:#8b98a5!important}button.ghost{color:#e7e9ea!important;border-color:#536471!important}}
h1{font-size:15px;margin:0;display:flex;align-items:center;justify-content:space-between}
.card{background:#f7f9f9;border-radius:10px;padding:10px 12px;margin-top:10px}
.big{font-size:26px;font-weight:700;line-height:1.1}.muted{color:#536471;font-size:12px}
.row{display:flex;gap:8px;margin-top:10px}button{flex:1;padding:7px 0;border-radius:999px;border:0;background:#1d9bf0;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
button.ghost{background:transparent;color:#0f1419;border:1px solid #cfd9de}button:disabled{opacity:.45;cursor:default}
.switch{position:relative;width:38px;height:22px}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cfd9de;border-radius:999px;cursor:pointer;transition:.15s}
.switch span:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:#1d9bf0}.switch input:checked+span:before{transform:translateX(16px)}
</style></head><body>
<h1>X Reply Filter <label class="switch"><input type="checkbox" id="enabled"><span></span></label></h1>
<div class="card" id="page"><div class="muted">本页</div><div class="big" id="hidden">–</div><div class="muted" id="detail">打开一条推文的详情页即可自动过滤评论区</div></div>
<div class="card"><div class="muted">模式</div><div id="mode">…</div></div>
<div class="card"><div class="muted">你教给 AI 的例子</div><div id="examples">…</div></div>
<div class="row"><button id="expand" disabled>全部展开</button><button class="ghost" id="options">设置</button></div>
<p class="muted" style="margin:10px 0 0">自动折叠推广、互动饵、跑题、AI 套话类回复。被折叠的回复变成一行灰条，点一下即可展开，不会删除任何内容。</p>
<script>
window.chrome = { tabs: { query: async () => [{ id: 1, url: "https://x.com/thsottiaux/status/100" }],
    sendMessage: async (_id, m) => m.type === "getStats" ? { scanned: 34, byRule: 2, byJev: 5, pending: 0, note: "", enabled: true } : { ok: true } },
  storage: { sync: { get: async d => d, set: async () => {} }, local: { get: async d => ({ ...d, examples: { bad: [1,2,3], good: [1] }, recent: [1,2,3,4] }) } },
  runtime: { sendMessage: async () => ({ used: 42, limit: 300 }), openOptionsPage() {} } };
</script><script src="/popup.js"></script></body></html>
