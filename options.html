<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>X 助手 · 设置</title><link rel="stylesheet" href="ui.css">
<style>
body{padding:32px 16px 60px}.wrap{max-width:560px;margin:0 auto}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:16px}.hero h1{font-size:20px;margin:0;line-height:1.2}.hero .sub{color:var(--muted);font-size:12px}
h2{font-size:15px;margin:0}
.row{display:flex;align-items:center;gap:12px;margin-top:14px}.row>label{flex:none;width:64px;font-size:13px;color:var(--muted)}.row>.ctl{flex:1;min-width:0;display:flex;gap:8px;align-items:center}.row>.ctl>input{flex:1}
.range-row{display:flex;align-items:center;gap:12px;flex:1}.range-row output{font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600;font-size:13px}
.foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.result{margin:10px 0 0 76px;padding:6px 10px}
.chip .x{margin-left:2px;opacity:.6}.chip:hover .x{opacity:1}
.sub-h{margin-top:14px;font-size:12px;font-weight:600;color:var(--muted)}
</style></head><body><div class="wrap">

<div class="hero"><div class="ico f" style="width:40px;height:40px;border-radius:11px;font-size:18px">X</div><div><h1>X 助手</h1><div class="sub">改动即时保存</div></div></div>

<section class="card" id="translate">
  <div class="card-head"><span class="ico tr">译</span><div class="grow"><h2>自动翻译</h2><div class="muted small">X / Reddit 上的外文原地变成中文</div></div>
    <label class="switch tr"><input type="checkbox" id="tr_enabled"><span></span></label></div>
  <div class="row"><label>API Key</label><div class="ctl"><input type="password" id="tr_apiKey" placeholder="粘贴硅基流动 API Key" autocomplete="off"><button class="tr sm" id="tr_test" type="button">测试</button></div></div>
  <div class="row"><label>模型</label><div class="ctl"><input type="text" id="tr_model" list="tr_models" autocomplete="off"><datalist id="tr_models"></datalist></div></div>
  <div class="row"><label>显示</label><div class="ctl"><div class="seg" id="tr_mode"><button data-v="replace">原地替换</button><button data-v="bilingual">双语对照</button></div></div></div>
  <div class="row"><label>站点</label><div class="ctl chips"><label class="chip"><input type="checkbox" id="tr_site_x">X</label><label class="chip"><input type="checkbox" id="tr_site_reddit">Reddit</label></div></div>
  <div class="result" id="tr_result"></div>
  <div class="foot" id="tr_foot"></div>
</section>

<section class="card" id="filter">
  <div class="card-head"><span class="ico f">滤</span><div class="grow"><h2>评论过滤</h2><div class="muted small">推文详情页折叠低质量回复，点一下展开</div></div>
    <label class="switch"><input type="checkbox" id="f_enabled"><span></span></label></div>
  <div class="row"><label>折叠</label><div class="ctl chips"><label class="chip"><input type="checkbox" id="c_spam">推广 / 垃圾</label><label class="chip"><input type="checkbox" id="c_bait">互动饵</label><label class="chip"><input type="checkbox" id="c_offtopic">跑题</label><label class="chip"><input type="checkbox" id="c_slop">AI 套话</label></div></div>
  <div class="row"><label>阈值</label><div class="ctl"><div class="range-row"><input type="range" id="f_threshold" min="0.5" max="0.95" step="0.05"><output id="f_thresholdOut"></output></div></div></div>
  <div class="row" id="f_blockedRow" hidden><label>已屏蔽</label><div class="ctl chips" id="f_blocked"></div></div>
  <div class="foot" id="f_foot"></div>
</section>

<section class="card" id="learn" hidden>
  <div class="card-head"><span class="ico learn">学</span><div class="grow"><h2>教 AI 你的口味</h2><div class="muted small">确认过的回复会成为 AI 判断新回复的参考</div></div></div>
  <div id="recentWrap"><div class="sub-h">最近自动隐藏 · 待确认</div><div class="list" id="recent"></div></div>
  <div id="examplesWrap"><div class="sub-h">已记住的例子</div><div class="list" id="examples"></div></div>
</section>

</div>
<div class="toast" id="toast">已保存</div>
<script src="options.js"></script></body></html>
